name: Companion Module Checks

on:
  push:

jobs:
  check:
    name: Check module
    if: ${{ !contains(github.repository, 'companion-module-template-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22 --force
      - name: Check module metadata
        shell: bash
        run: |
          test ! -f package-lock.json
          test -f yarn.lock
          test -f companion/HELP.md
          MODULE_NAME="${GITHUB_REPOSITORY#*/companion-module-}"
          test "$(jq -r '.id' companion/manifest.json)" = "$MODULE_NAME"
          test "$(jq -r '.runtime.type' companion/manifest.json)" = node26
          test "$(jq -r '.runtime.apiVersion' companion/manifest.json)" = 0.0.0
          if grep -q your-module-name companion/manifest.json; then exit 99; fi
          jq -e '.products | arrays and length > 0' companion/manifest.json
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=$(jq -r '.version' package.json)
            TAG="${GITHUB_REF#refs/tags/}"
            test "$TAG" = "$VERSION" || test "$TAG" = "v$VERSION"
          fi
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check tools version
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const name = '@companion-module/tools'
          let dir = path.dirname(require.resolve(name))
          while (dir !== path.dirname(dir)) {
            const file = path.join(dir, 'package.json')
            if (fs.existsSync(file)) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
              if (pkg.name === name) {
                if (!require('semver').satisfies(pkg.version, '^2.9.0')) process.exit(1)
                console.log(`${name} ${pkg.version}`)
                process.exit(0)
              }
            }
            dir = path.dirname(dir)
          }
          process.exit(1)
          NODE
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src test -name '*.js')
      - name: Test module
        run: yarn test
      - name: Build module
        run: |
          if jq -e '.scripts.build' package.json > /dev/null; then
            yarn build
          fi
      - name: Package module
        run: yarn companion-module-build --output=pkg
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pkg
          path: pkg.tgz
      - name: Check module launches
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          RESULT=$(node pkg/main.js 2>&1)
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ] || grep -q 'Failed to startup module' <<< "$RESULT"; then
            echo "Module loaded successfully"
          else
            echo "$RESULT"
            exit 99
          fi
